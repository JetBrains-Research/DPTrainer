name: Release Package

on:
  push:
    tags:
      - "*-v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and Publish
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: release
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up uv
        uses: astral-sh/setup-uv@v4

      - name: Determine package and version
        id: parse
        shell: bash
        env:
          TAG_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          tag="${TAG_REF_NAME:-}"
          if [[ "$tag" =~ ^([A-Za-z0-9._-]+)-v([0-9]+\.[0-9]+\.[0-9]+.*)$ ]]; then
            package="${BASH_REMATCH[1]}"
            version="${BASH_REMATCH[2]}"
          fi

          if [[ -z "$package" || -z "$version" ]]; then
            echo "Missing or invalid package/version; provide inputs or tag <slug>-vX.Y.Z" >&2
            exit 1
          fi

          pkg_dir="packages/$package"
          if [[ ! -f "$pkg_dir/pyproject.toml" ]]; then
            echo "Package directory not found: $pkg_dir" >&2
            exit 1
          fi
          
          echo "package=$package" >> "$GITHUB_OUTPUT"
          echo "pkg_dir=$pkg_dir"   >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache UV
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/uv
          key: uv-${{ steps.parse.outputs.package }}-${{ runner.os }}-hash-${{ hashFiles(format('{0}/uv.lock', steps.parse.outputs.pkg_dir)) }}
          restore-keys: |
            uv-${{ steps.parse.outputs.package }}-${{ runner.os }}-

      - name: Build sdist + wheel
        working-directory: ${{ steps.parse.outputs.pkg_dir }}
        run: |
          rm -rf dist/
          uv version ${{ steps.parse.outputs.version }} --no-sync
          uv build --sdist --wheel

      - name: Smoke install built wheel
        working-directory: ${{ steps.parse.outputs.pkg_dir }}
        run: |
          uv run --with ./dist/*.whl --no-project -- uv pip check

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@71fee32a0bb7e97b4d33d548e7d957010649d8fa # v2.1.3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT_EMAIL }}
          token_format: access_token
          access_token_lifetime: 3600s

      - name: Publish artifacts with Twine
        working-directory: ${{ steps.parse.outputs.pkg_dir }}
        env:
          UV_PUBLISH_USERNAME: "oauth2accesstoken"
          UV_PUBLISH_PASSWORD: ${{ steps.auth.outputs.access_token }}
        run: |
          uv publish --index jbr-fed-python ./dist/* --verbose
